name: Publish to Instagram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the token only; batch = post the next N queued carousels now"
        type: choice
        options: [check, batch]
        default: batch
      count:
        description: "How many carousels to post (batch mode)"
        default: "4"

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always the latest queue, even if this run started late

      - name: Publish queued posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
          COUNT: ${{ github.event.inputs.count }}
          IG_USER_ID: "17841415534433698"   # @adalatiq (not secret)
        run: python3 scripts/publish.py

      - name: Move published post out of the queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue published
          if ! git diff --cached --quiet; then
            git commit -m "Published $(git diff --cached --name-only -- published | cut -d/ -f2 | sort -u | grep -v gitkeep | tr '\n' ' ')"
            git push
          fi
