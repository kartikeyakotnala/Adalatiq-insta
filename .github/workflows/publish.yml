name: Publish to Instagram

on:
  schedule:
    - cron: "7 4 * * *"    # 09:37 IST
    - cron: "7 14 * * *"   # 19:37 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the token only, publish = post the next due carousel"
        type: choice
        options: [check, publish]
        default: check

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish next due post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: python3 scripts/publish.py

      - name: Move published post out of the queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue published
          if ! git diff --cached --quiet; then
            git commit -m "Published $(ls -t published | head -1)"
            git push
          fi
